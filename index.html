<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Palestra</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--card2:#eceef2;--tx:#14161a;--mu:#6b7280;--ln:#dfe2e7;--ac:#f2600c;--ac2:#ffeadd;--ok:#16a34a;--okb:#e3f6e9;--fig:#1f2937;--fig2:#a3abb7;--eq:#a7aeb9;--warn:#9a4a00;--warnb:#fff3e0}
[data-theme=dark]{--bg:#0f1115;--card:#191c22;--card2:#252931;--tx:#eef0f3;--mu:#9aa1ac;--ln:#2b3039;--ac:#ff7a2a;--ac2:#3a2416;--ok:#22c55e;--okb:#12301d;--fig:#e8eaee;--fig2:#69717e;--eq:#58606d;--warn:#fbbf24;--warnb:#33290f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Roboto,"Segoe UI",sans-serif}
body{padding:calc(56px + env(safe-area-inset-top)) 0 calc(84px + env(safe-area-inset-bottom))}
body.tm{padding-bottom:calc(170px + env(safe-area-inset-bottom))}
header{position:fixed;top:0;left:0;right:0;height:calc(56px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 8px 0;display:flex;align-items:center;gap:4px;background:var(--bg);border-bottom:1px solid var(--ln);z-index:10}
header h1{font-size:19px;margin:0 0 0 6px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdbtn{background:none;border:0;color:var(--tx);width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.hdbtn[hidden]{display:none}.hdbtn svg{width:26px;height:26px}
main{max-width:640px;margin:0 auto;padding:12px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:9px 0 7px;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit}
nav button.on{color:var(--ac);font-weight:600}
nav svg,.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
h2{margin:2px 0 4px;font-size:22px}h3{margin:0 0 6px;font-size:18px}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;border:1px solid var(--ln)}
.card.hl{border:2px solid var(--ac)}
.li{cursor:pointer}
.muted{color:var(--mu)}.small{font-size:13.5px}.b{font-weight:700;color:var(--ac)}
.lblh{margin:14px 4px 6px;text-transform:uppercase;letter-spacing:.06em;font-size:12px}
.badge{display:inline-block;font-size:12px;background:var(--ac);color:#fff;border-radius:20px;padding:2px 9px;vertical-align:middle;font-weight:600}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font:600 17px/1.2 system-ui,-apple-system,Roboto,sans-serif;background:var(--card2);color:var(--tx);margin-top:10px;cursor:pointer}
.btn.big{min-height:62px;font-size:19px}
.btn.pri{background:var(--ac);color:#fff}.btn.ok{background:var(--ok);color:#fff}
.btn.ghost{background:none;color:var(--mu);font-weight:500}
.btn.rest{background:var(--ac2);color:var(--ac);min-height:56px}
.btn.sm{display:inline-block;width:auto;padding:11px 15px;font-size:15px;margin:8px 6px 0 0}
.btn small{font-weight:500;opacity:.85}
.warn{background:var(--warnb);color:var(--warn);border-radius:12px;padding:10px 12px;margin-top:10px;font-weight:600;font-size:15px}
.hint{color:var(--ac);font-weight:600;font-size:14.5px;margin:6px 0}
.row{display:flex;align-items:center;gap:8px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--card2);border:1px solid var(--ln);border-radius:12px;padding:12px;width:100%;min-height:48px}
textarea{resize:vertical;min-height:60px}
input[type=checkbox]{width:26px;height:26px;min-height:0;accent-color:var(--ac)}
input::-webkit-inner-spin-button,input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
label.lbl{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.seg{display:flex;background:var(--card2);border-radius:14px;padding:4px;gap:4px;margin-top:8px}
.seg button{flex:1;border:0;background:none;padding:13px 4px;border-radius:11px;color:var(--tx);font:600 16px system-ui,-apple-system,Roboto,sans-serif;cursor:pointer}
.seg button.on{background:var(--ac);color:#fff}
/* esercizi */
.whead{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 10px;gap:8px}
.ex{background:var(--card);border:1px solid var(--ln);border-radius:16px;margin-bottom:10px;overflow:hidden}
.ex.cur{border:2px solid var(--ac);box-shadow:0 0 0 3px var(--ac2)}
.exh{display:flex;align-items:center;gap:10px;padding:10px 12px;min-height:68px;cursor:pointer}
.exn{flex:1;min-width:0}.exname{font-weight:700;font-size:17px}
.ex.done .exname{color:var(--mu)}
.chk{width:36px;height:36px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;border:2px solid var(--ln);color:#fff}
.ex.done .chk{background:var(--ok);border-color:var(--ok)}
.thumb{width:68px;height:51px;flex:none;background:var(--card2);border-radius:10px;overflow:hidden}
.thumb svg{width:100%;height:100%;display:block}
.exb{padding:0 12px 14px}
.figbig{background:var(--card2);border-radius:14px;padding:4px;margin-bottom:8px}
.figbig svg{width:100%;max-height:210px;display:block}
.last{font-size:15.5px;margin:6px 0}
.wctl{display:flex;gap:10px;align-items:stretch;margin:12px 0}
.sq{width:68px;height:68px;border-radius:16px;border:0;background:var(--card2);color:var(--tx);font:700 32px/1 system-ui,-apple-system,Roboto,sans-serif;flex:none;cursor:pointer}
.sq:active,.set:active,.btn:active{transform:scale(.97)}
.wval{flex:1;display:flex;align-items:center;justify-content:center;background:var(--card2);border-radius:16px;padding:0 10px;min-width:0}
.wval input{background:none;border:0;font-size:36px;font-weight:800;text-align:center;padding:0;min-width:0}
.wval span{color:var(--mu);font-weight:600}
.sets{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0}
.set{width:60px;height:60px;border-radius:50%;border:2px solid var(--ln);background:var(--card);color:var(--tx);font:700 21px system-ui,-apple-system,Roboto,sans-serif;cursor:pointer}
.set.on{background:var(--ok);border-color:var(--ok);color:#fff}
.prow{display:flex;align-items:center;gap:7px;margin:8px 0;padding:6px;border-radius:14px;background:var(--card2)}
.prow.on{background:var(--okb)}
.pn{width:42px;text-align:center;font-size:22px;font-weight:800;line-height:1;flex:none}
.pn small{display:block;font-size:11px;font-weight:500;color:var(--mu)}
.prow .sq{width:52px;height:58px;font-size:27px;background:var(--card)}
.prow .wval{height:58px;background:var(--card)}.prow .wval input{font-size:27px}
.prow .set{width:54px;height:54px;flex:none}
.rests{display:flex;gap:8px}
.cgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.cgrid input{font-size:22px;font-weight:700;text-align:center}
details{border-top:1px solid var(--ln);margin-top:12px}
summary{padding:13px 0 6px;font-weight:600;cursor:pointer;list-style:none;color:var(--mu)}
summary::-webkit-details-marker{display:none}
.prev{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--ln)}
.prev:first-of-type{border-top:0}
.edrow{border:1px solid var(--ln);border-radius:14px;margin-top:8px;overflow:hidden}
.edrow .exh{min-height:58px}.edb{padding:0 12px 12px}
/* timer */
#timer{position:fixed;left:8px;right:8px;bottom:calc(70px + env(safe-area-inset-bottom));background:var(--tx);color:var(--bg);border-radius:18px;padding:10px 10px 12px 16px;display:flex;align-items:center;gap:8px;z-index:11;box-shadow:0 6px 24px rgba(0,0,0,.35);overflow:hidden;max-width:624px;margin:0 auto}
#timer[hidden]{display:none}
#timer .tl{flex:1;min-width:0}
#tlab{font-size:13px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tt{font-size:38px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.05}
#timer button{width:58px;height:58px;border-radius:14px;border:0;background:rgba(128,128,128,.28);color:inherit;font:700 16px system-ui,-apple-system,Roboto,sans-serif;cursor:pointer}
#timer.end{background:var(--ok);color:#fff;animation:pulse 1s ease-in-out 4}
#tbar{position:absolute;left:0;bottom:0;height:5px;background:var(--ac);width:0}
@keyframes pulse{50%{transform:scale(1.03)}}
.toast{position:fixed;left:50%;top:calc(66px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:11px 18px;border-radius:12px;z-index:30;font-weight:600;max-width:90%;text-align:center}
/* grafici */
.chart svg{width:100%;display:block;margin-top:8px}
.chart text{fill:var(--mu);font-size:10px;font-family:inherit}
.chart .gl{stroke:var(--ln);stroke-width:1}
.chart .pl{stroke:var(--ac);fill:none;stroke-width:2.5;stroke-linejoin:round}
.chart .ar{fill:var(--ac);opacity:.12}
.chart circle{fill:var(--ac)}
table.t{width:100%;border-collapse:collapse;font-size:15px;margin-top:8px}
.t td{padding:9px 4px;border-bottom:1px solid var(--ln)}.t td:last-child{text-align:right;font-weight:700}
.stats{display:flex;text-align:center}.stats div{flex:1}.stats b{display:block;font-size:26px}.stats span{font-size:13px;color:var(--mu)}
.wline{padding:9px 0;border-top:1px solid var(--ln)}.wline:first-of-type{border-top:0}
/* disegni */
.fig line{stroke-linecap:round}
.fig .b{stroke:var(--fig)}.fig .f{stroke:var(--fig2)}.fig .hc{fill:var(--fig)}
.fig .cb{stroke:var(--eq)}.fig .lv{stroke:var(--eq)}
.fig .pad{stroke:var(--ac);opacity:.5}
.fig .hf{fill:var(--ac)}.fig .hs{stroke:var(--ac)}
.fig .eq *{stroke:var(--eq);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.fig .eq .th{stroke-width:6}.fig .eq .fl{fill:var(--card);stroke-width:2}
</style>
</head>
<body>
<header>
  <button class="hdbtn" id="bk" data-a="back" hidden aria-label="Indietro"><svg class="ic" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <h1 id="ttl">Palestra</h1>
</header>
<main id="app"></main>
<div id="timer" hidden>
  <div class="tl"><div id="tlab">Recupero</div><div id="tt">0:00</div></div>
  <button data-a="tmadd" data-d="-15">−15</button><button data-a="tmadd" data-d="15">+15</button><button data-a="tmstop" aria-label="Chiudi">✕</button>
  <div id="tbar"></div>
</div>
<nav>
  <button data-a="tab" data-v="oggi"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Oggi</button>
  <button data-a="tab" data-v="schede"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>Schede</button>
  <button data-a="tab" data-v="storico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Storico</button>
  <button data-a="tab" data-v="progressi"><svg viewBox="0 0 24 24"><path d="M3 20h18M6 16l4-5 4 3 5-7"/></svg>Progressi</button>
  <button data-a="tab" data-v="opzioni"><svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>Opzioni</button>
</nav>
<input type="file" id="fimp" accept=".json,application/json" hidden>
<script>
'use strict';
const APPV='1.5';
/* ---------- utilità ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const slug=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const todayISO=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const fmtD=iso=>new Date(iso).toLocaleDateString('it-IT',{day:'numeric',month:'short'});
const fmtDL=iso=>new Date(iso).toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
const fmtH=iso=>new Date(iso).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
const num=v=>{if(v===''||v==null)return null;const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:n};
const r2=v=>Math.round(v*100)/100;
const fmtKg=v=>v==null?'–':String(r2(v)).replace('.',',');
const fmtSec=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
const fmtRest=s=>s<60?`${s}"`:(s%60?`${Math.floor(s/60)}'${s%60}"`:`${s/60}'`);
function parseSec(t){
  if(t==null||t==='')return[];
  return String(t).split(/[–—\-\/]/).map(x=>{x=x.trim();let m=x.match(/^(\d+)\s*[''’]\s*(?:(\d+)\s*["”'']*)?$/);if(m)return +m[1]*60+(+m[2]||0);m=x.match(/^(\d+)\s*(?:["”]|''|s)?$/);if(m)return +m[1];return null}).filter(x=>x);
}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
/* ---------- database ---------- */
let db;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('palestra',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('plans',{keyPath:'id'});d.createObjectStore('workouts',{keyPath:'id'});d.createObjectStore('kv',{keyPath:'k'})};r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}
function tx(store,mode,fn){return new Promise((res,rej)=>{const t=db.transaction(store,mode);const req=fn(t.objectStore(store));t.oncomplete=()=>res(req&&'result'in req?req.result:undefined);t.onerror=()=>rej(t.error)})}
const dbAll=s=>tx(s,'readonly',o=>o.getAll());
const dbPut=(s,v)=>tx(s,'readwrite',o=>o.put(JSON.parse(JSON.stringify(v))));
const dbDel=(s,k)=>tx(s,'readwrite',o=>o.delete(k));
const kvSet=(k,v)=>dbPut('kv',{k,v});
/* ---------- stato ---------- */
const S={plans:[],workouts:[],mem:{},set:{tema:'auto',passo:1,activeId:null,ultimoBackup:null,seeded:false},cur:null,view:'oggi',arg:null,open:null,ui:{},ed:null,edOpen:null,back:null};
const saveSet=()=>kvSet('set',S.set), saveMem=()=>kvSet('mem',S.mem);
let curT;const saveCur=()=>{clearTimeout(curT);curT=setTimeout(()=>kvSet('cur',S.cur),250)};
async function load(){
  S.plans=await dbAll('plans');
  S.workouts=(await dbAll('workouts')).sort((a,b)=>a.data<b.data?1:-1);
  (await dbAll('kv')).forEach(r=>{if(r.k==='mem')S.mem=r.v||{};else if(r.k==='set')Object.assign(S.set,r.v);else if(r.k==='cur')S.cur=r.v});
  if(!S.plans.length&&!S.set.seeded){for(const p of SEED){const n=normPlan(p);await dbPut('plans',n);S.plans.push(n)}S.set.activeId='scheda-2';S.set.seeded=true;await saveSet()}
  await migrate();
}
const activePlan=()=>S.plans.find(p=>p.id===S.set.activeId)||[...S.plans].sort((a,b)=>(b.inizio||'').localeCompare(a.inizio||''))[0];
/* ---------- schede iniziali ---------- */
const PROG1=[{rip:15,serie:3},{rip:12,serie:4},{rip:10,serie:5},{rip:8,serie:5}];
const RISC={key:'riscaldamento',nome:'Riscaldamento run/bike',tipo:'cardio',minuti:'5–10',attrezzo:'Run'};
const FIN=m=>({key:'finale',nome:'Finale run/bike',tipo:'cardio',minuti:m,attrezzo:'Run'});
const SEED=[
{id:'scheda-1',nome:'Scheda 1',inizio:'2026-10-07',durata:'',recupero:'30"–60"',progressione:PROG1,sessioni:[{nome:'Allenamento',esercizi:[
  RISC,
  {key:'goblet-squat',nome:'Goblet squat',serie:3,rip:15,note:'Peso del manubrio'},
  {key:'chest-press',nome:'Chest press',serie:3,rip:15},
  {key:'vertical-traction',nome:'Vertical traction',serie:3,rip:15},
  {key:'curl-cavo',nome:'Bicipiti poliercolina',serie:3,rip:15,disegno:'curlcavo'},
  {key:'push-down',nome:'Tricipiti poliercolina',serie:3,rip:15,disegno:'pushdown'},
  {key:'shoulder-press',nome:'Shoulder press',serie:3,rip:15},
  {key:'crunch-inversi',nome:'Crunch inversi',tipo:'libero',serie:3,rip:15},
  {key:'crunch',nome:'Crunch',tipo:'libero',serie:3,rip:15},
  FIN('15–20')]}]},
{id:'scheda-2',nome:'Scheda 2',inizio:'2026-11-09',durata:'6–7 settimane',recupero:"1'",progressione:[],sessioni:[
 {nome:'Allenamento A',esercizi:[
  RISC,
  {key:'affondi-indietro',nome:'Affondi indietro',tipo:'piramide',piramide:[12,10,8,6],recupero:"1'30\"",note:'Peso del singolo manubrio'},
  {key:'leg-extension',nome:'Leg extension',serie:3,rip:12,recupero:"1'"},
  {key:'pectoral',nome:'Pectoral',serie:3,rip:15,recupero:"1'"},
  {key:'spinte-30',nome:'Spinte 30°',tipo:'piramide',piramide:[12,10,8,6],recupero:"1'30\"",impostazioni:{inclinazione:'1'},note:'Manubri su panca inclinata'},
  {key:'lento-avanti',nome:'Lento avanti in piedi',tipo:'piramide',piramide:[12,10,8,6],recupero:"1'30\"",note:'Manubri'},
  {key:'curl-cavo',nome:'Curl cavo',serie:3,rip:10,recupero:"1'30\""},
  {key:'curl-panca-45',nome:'Curl panca 45°',serie:3,rip:10,recupero:"1'",note:'Peso del singolo manubrio'},
  {key:'crunch',nome:'Crunch',tipo:'libero',serie:3,rip:15,recupero:"1'"},
  FIN('15')]},
 {nome:'Allenamento B',esercizi:[
  RISC,
  {key:'hyperextension',nome:'Hyperextension',serie:3,rip:10,recupero:"1'30\"",impostazioni:{perno:'N°4'}},
  {key:'leg-curl-mono',nome:'Leg curl mono',tipo:'piramide',piramide:[12,10,8,6],recupero:"1'",note:'Una gamba alla volta'},
  {key:'v-row',nome:'V-row orizzontale',serie:3,rip:15,recupero:"1'"},
  {key:'lat-machine',nome:'Lat machine',tipo:'piramide',piramide:[12,10,8,6],recupero:"1'30\""},
  {key:'face-pull',nome:'Face pull',serie:3,rip:12,recupero:"1'"},
  {key:'push-down',nome:'Push down',serie:3,rip:10,recupero:"1'30\""},
  {key:'french-manubri',nome:'French manubri',serie:3,rip:10,recupero:"1'",note:'Peso del singolo manubrio'},
  {key:'plank',nome:'Plank',tipo:'tempo',serie:3,durata:"1'",recupero:"1'"},
  FIN('15')]}]}
];
const START2={'affondi-indietro':{pesi:[4,5,6,8]},'leg-extension':{peso:10,rip:12},'pectoral':{peso:20,rip:15},'spinte-30':{pesi:[6,8,10,10]},'lento-avanti':{pesi:[2,4,5,6]},'curl-cavo':{peso:30,rip:10},'curl-panca-45':{peso:6,rip:10},
 'hyperextension':{peso:0,rip:10},'leg-curl-mono':{pesi:[10,15,20,25]},'v-row':{peso:25,rip:15},'lat-machine':{pesi:[20,25,30,35]},'face-pull':{peso:25,rip:12},'push-down':{peso:35,rip:10},'french-manubri':{peso:4,rip:10}};
async function migrate(){
  if((S.set.dataV||1)<2)await migrate2();
  if(S.set.dataV<3)await migrate3();
  if(S.set.dataV<4){
    for(const p of S.plans){let ch=false;p.sessioni.forEach(s=>s.esercizi.forEach(e=>{if(e.key==='riscaldamento'||e.key==='finale'){e.attrezzo='Run';if(e.key==='riscaldamento')e.nome='Riscaldamento run/bike';ch=true}}));if(ch)await dbPut('plans',p)}
    S.set.dataV=4;await saveSet();
  }
}
async function migrate2(){
  const p=normPlan(SEED.find(x=>x.id==='scheda-2'));await dbPut('plans',p);S.plans=S.plans.filter(x=>x.id!=='scheda-2').concat(p);

function chartSVG(pts,unit){
  if(!pts.length)return'<div class="muted" style="margin-top:10px">Ancora nessun dato per questo esercizio.</div>';
  const W=340,H=200,pl=36,pr=12,pt_=14,pb=26,vs=pts.map(p=>p.v);
  let lo=Math.min(...vs),hi=Math.max(...vs);if(lo===hi){lo-=2;hi+=2}const pad=(hi-lo)*.12;lo=Math.max(0,lo-pad);hi+=pad;
  let t0=pts[0].t,t1=pts.at(-1).t;if(t0===t1){t0-=864e5*3;t1+=864e5*3}
  const x=t=>pl+(t-t0)/(t1-t0)*(W-pl-pr),y=v=>pt_+(1-(v-lo)/(hi-lo))*(H-pt_-pb);
  let s=`<svg viewBox="0 0 ${W} ${H}">`;
  for(let i=0;i<=3;i++){const v=lo+(hi-lo)*i/3;s+=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-5}" y="${y(v)+3}" text-anchor="end">${fmtKg(Math.round(v*10)/10)}</text>`}
  const d=pts.map(p=>`${x(p.t).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
  s+=`<polygon class="ar" points="${x(pts[0].t)},${H-pb} ${d} ${x(pts.at(-1).t)},${H-pb}"/><polyline class="pl" points="${d}"/>`;
  pts.forEach(p=>{s+=`<circle cx="${x(p.t)}" cy="${y(p.v)}" r="3.5"/>`});
  s+=`<text x="${pl}" y="${H-8}">${fmtD(pts[0].t)}</text><text x="${W-pr}" y="${H-8}" text-anchor="end">${fmtD(pts.at(-1).t)}</text><text x="${pl}" y="9">${unit}</text></svg>`;
  return s;
}

});
document.addEventListener('change',ev=>{
  const el=ev.target,f=el.dataset.f;
  const i=+el.dataset.i,sum=()=>{const x=document.querySelector(`#ex${i} .exh .small`);if(x)x.innerHTML=exSum(S.cur.esercizi[i])};
  if(f==='ppeso'){const e=S.cur.esercizi[i],j=+el.dataset.j,v=e.sets[j].peso;for(let k=j+1;k<e.sets.length;k++)if(e.sets[k].peso==null){e.sets[k].peso=v;const inp=document.querySelector(`[data-f=ppeso][data-i="${i}"][data-j="${k}"]`);if(inp)inp.value=v??''}saveCur();sum()}
  else if(f==='peso'||f==='imp'||f==='card')sum();
  else if(f==='ed'&&el.dataset.rr)rr();
  else if(f==='pk'){S.ui.pk=el.value;rr()}
  else if(f==='sel'){S.ui.sel=+el.value;rr()}
});
document.addEventListener('toggle',ev=>{const d=ev.target;if(d.dataset&&d.dataset.u)S.ui[d.dataset.u]=d.open},true);
addEventListener('beforeinstallprompt',e=>{e.preventDefault();S.inst=e;if(S.view==='opzioni')rr()});
/* ---------- avvio ---------- */
(async()=>{
  await openDB();await load();applyTheme();
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().then(r=>{S.persist=r}).catch(()=>{});
  go(S.cur?'allena':'oggi');
  if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
